[project]
name = "aletheia"
version = "0.1.0"
description = "A conversational agent platform with a streaming terminal interface"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=3.1.0",
    "rich>=13.7.0",
    "textual>=8.2.8",
]

[project.scripts]
aletheia = "aletheia:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["aletheia", "config"]
packages = ["core", "core.llm", "ui", "ui.tui"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
