[project]
name = "aletheia"
version = "0.1.0"
description = "A conversational agent platform with a streaming terminal interface"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.7.0",
]

[tool.uv]
# 애플리케이션 프로젝트 — 자체를 패키지로 빌드/설치하지 않고 의존성만 관리한다.
# 실행: uv run main.py
package = false
